name: Windows build (ADE v2)

on:
  push:
    branches:
      - main
      - 'claude/**'
      - 'win-**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nsis:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Build NSIS installer
        run: npm run tauri -- build

      - name: Collect bundles
        shell: bash
        run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/nsis/*.exe out/ || true
          cd src-tauri/target/release
          7z a -tzip "$GITHUB_WORKSPACE/out/agent-launcher-ade-portable.zip" "agent-launcher.exe"
          cd "$GITHUB_WORKSPACE"
          ls -lh out
          test -n "$(ls -A out)" || { echo "no bundles were produced"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: agent-launcher-ade-windows
          path: out/*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
