name: Linux build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  deb:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libasound2-dev \
            build-essential curl wget file

      - name: Install npm dependencies
        run: npm ci

      - name: Build deb and AppImage
        run: npm run tauri:linux

      - name: Collect bundles
        run: |
          mkdir -p out
          find src-tauri/target/release/bundle -name '*.deb' -exec cp {} out/ \;
          find src-tauri/target/release/bundle -name '*.AppImage' -exec cp {} out/ \;
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: agent-launcher-linux
          path: out/*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
