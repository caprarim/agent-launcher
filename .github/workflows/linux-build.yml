name: Linux build (ADE v2)

# Builds the Ubuntu bundles for the Tauri v2 ADE app. Runs on ubuntu-22.04 on
# purpose: its glibc (2.35) is old enough that the artifacts also run on 24.04,
# while a 24.04 build would not run on 22.04.

on:
  push:
    branches:
      - main
      - 'claude/**'
      - 'linux-**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libasound2-dev \
            patchelf \
            build-essential curl wget file

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Build deb and AppImage
        run: npm run tauri:linux

      - name: Collect bundles
        run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/deb/*.deb out/ || true
          cp src-tauri/target/release/bundle/appimage/*.AppImage out/ || true
          ls -lh out
          test -n "$(ls -A out)" || { echo "no bundles were produced"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: agent-launcher-ade-linux
          path: out/*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
