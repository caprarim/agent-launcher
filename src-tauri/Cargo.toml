[package]
name = "agent-launcher"
version = "2.1.0"
description = "Launch multiple AI coding agents with split terminals"
authors = ["caprarim"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "agent_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
tiny_http = "0.12"
notify = "6"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
regex = "1"
once_cell = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
